- date: 23 January 2023
  headline: Domenic gave a talk at the <a href="https://www.becc.lu.se/calendar/bayeslund-2023">Bayes@Lund</a> conference, entitled <a href="https://github.com/DomDF/Bayes-Lund2023">Identifying data requirements using Bayesian decision analysis</a>.
- date: 12 December 2023
  headline: Lawrence gave talk at the Institute of Physics, entitled Physics-Constrained Transfer Learning with Bayesian Multilevel Models.
- date: 01 November 2022
  headline: Domenic's paper <a href="https://doi.org/10.1016/j.strusafe.2022.102262">A probabilistic model for quantifying uncertainty in the failure assessment diagram</a> has been published.
- date: 01 September 2022
  headline: Deniz has taken up an Lectureship at Imperial College London. Congratulations Deniz!
- date: 18 August 2022
  headline: Alex gave a seminar to the Complex Systems Group at the University of Western Australia.
- date: 17 August 2022
  headline: Connor successfully defended his PhD thesis, entitled <a href="https://doi.org/10.26182/ztm5-0z90">Statistical finite element methods for nonlinear PDEs</a>.
- date: 01 August 2022
  headline: The paper <a href="https://doi.org/10.1137/21M1463094">Statistical Finite Finite Elements via Langevin Dynamics</a> was accepted to SIAM JUQ. Congratulations Deniz, Connor, and Mark!
