  headline: The workshop "Accelerating generative models and nonconvex optimisation", part of the Turing Theory and Methods Challenge Fortnight series, was this week, co-organised by Deniz.
- date: 25 April 2022
  headline: The paper <a href="https://doi.org/10.1016/j.jcp.2022.111261">Low-rank statistical finite elements for scalable model-data synthesis</a> was accepted to Journal of Computational Physics. Congratulations Connor and Mark!
- date: 04 January 2022
  headline: The paper on <a href="https://doi.org/10.1016/j.patrec.2021.12.017">Anomaly detection in streaming data with gaussian process based stochastic differential equations</a> has been accepted at Pattern Recognition Letters. Congratulations Alex and Mark!
