- name: Alessandro Barp
  photo: alessandro_barp.jpg
  info: Alessandro is a Research Associate (postdoc) in the Engineering Department at the University of Cambridge and a visiting researcher at The Alan Turing Institute. His research focuses on the empowerment of measures via the geometrisation of statistical methods, such as Hamiltonian Monte Carlo and kernel algorithms built with Stein operators. After having completed the MMathPhys of The University of Warwick and Part III of the Mathematical Tripos at Cambridge, he received his PhD from Imperial College London.
  email: ab2286@cam.ac.uk
  number_educ: 3
  education1: PhD in Mathematics, Imperial College London, UK (2020)
  education2: MASt Part III of the Mathematical Tripos, University of Cambridge, UK (2016)
  education3: MMathPhys, University of Warwick, UK  (2015)
  
- name: Lawrence Bull
  photo: lawrence_bull.png
  info: Lawrence is a Research Associate at The Alan Turing Institute, in the Data-Centric engineering programme. His research considers probabilistic methods for performance and health monitoring, focussing on systems-level digital twins and partially supervised inference. Previously, he worked on statistical tools for the development of structural health monitoring in the Dynamics Research Group at the University of Sheffield.
  email: l.a.bull@sheffield.ac.uk
  website: https://labull.github.io/
  number_educ: 2
  education1: PhD in Engineering, University of Sheffield, UK (2019)
  education2: MEng Mechanical Engineering, University of Sheffield, UK (2016)
  
- name: Domenic Di Francesco
  photo: Dom_DiFrancesco.jpg
  info: "Domenic is a chartered mechanical engineer and Research Associate at The Alan Turing Institute, in the Data-Centric engineering programme. He previously worked in engineering consultancies, then completed an industrially sponsored PhD with academic supervision from Aalborg University (Denmark) and the University of Surrey (UK), and industrial supervision from TWI Ltd and Lloyds Register. His research is focused on industrial applications of computational statistics and has published work on the topics of: system effects, value of information, Bayesian hierarchical modelling, structural reliability and risk management."
  email: ddifrancesco@turing.ac.uk
  website: https://github.com/DomDF
  number_educ: 2
  education1: PhD in Engineering, University of Surrey, UK (2021)
  education2: MEng Mechanical Engineering, Durham University, UK (2012)

- name: Ieva Kazlauskaite
  photo: ieva_kazlauskaite.jpg
  info: Ieva is a Biometrika Fellow in the Engineering Department at the University of Cambridge. Her current research is in the area of data-centric engineering, focusing on structural problems and ways to combine statistical and numerical approaches to solutions of differential equations. Prior to that, Ieva completed her doctoral degree at the University of Bath working on Gaussian processes. During her doctoral studies she spent 3 years in industry as a Research Engineer / Engineering Doctorate student at the Frostbite Physics Team at Electronic Arts.
  email: ik394@cam.ac.uk
  website: https://ievakazlauskaite.github.io/
  number_educ: 2
  education1: Engineering Doctorate in Computer Science, University of Bath, UK (2020)
  education2:  MMath in Mathematics, University of Durham, UK (2014)

- name: Kangrui Wang
  photo: kangrui_wang.jpg
  info: Kangrui is a Research Associate in the Engineering Department at the University of Cambridge. His research focus on stochastic modelling of high-dimensional data and developing non-stationary non-separable kernels for Gaussian process based models. His interest also lies in the application of deep Gaussian processes to non-stationary spatio-temporal problems. Before joining the group, he was a research associate in the Alan Turing Institute under London air quality project.
  email: kw541@cam.ac.uk
  number_educ: 3
  education1: PhD in Applied math, University of Leicester, UK
  education2: MSc in Actuarial Science, University of Leicester, UK
  education3: BSc in Finance, East China University of Political Science and Law, China

- name: Ben Boys
  photo: ben_boys.jpg
  info: Ben is a PhD student in the Future Infrastructure and Built Environment CDT at the University of Cambridge supervised by Professor Mark Girolami. During his PhD, he will be working on developing probabilistic models that simulate outcomes of schedules, building upon state-of-the-art deep learning technologies already developed at his co-sponsor company nPlan. Prior to Cambridge, he was working as a Research Assistant at the Data Centric Engineering Group at the University of Exeter.
  email: bb515@cam.ac.uk
  website: https://github.com/bb515
  number_educ: 1
  education1: MEng in Information and Computer Engineering, University of Cambridge (2020)

- name: Justin Bunker
  photo: justin_bunker.png
  info: Justin is a PhD student who is supervised by Professor Mark Girolami in the Engineering department at the University of Cambridge. His research involves the study of statistical approaches for dealing with streaming data. Before starting his PhD, he worked for two years as a software engineer at a trading firm then returned to academia to complete an MPhil and continue on as a research assistant. His PhD is funded by Splunk Inc.
  email: jb2200@cantab.ac.uk
  website: https://github.com/bunkerj
  number_educ: 2
  education1: MPhil in Machine Learning and Machine Intelligence, University of Cambridge (2019)
  education2: BEng in Computer Engineering, Concordia University (2016)
  
- name: Connor Duffin
  photo: connor_duffin.jpg
  info: Connor is Research Assistant in the Engineering Department at the University of Cambridge, whilst also completing his Ph.D. in the Department of Mathematics and Statistics at the University of Western Australia. He is funded by the PREMIERE grant. His research focusses on developing statistical methodology to combine partial differential equations with observed data. 
  email: cpd32@cam.ac.uk
  website: https://connor-duffin.github.io
  number_educ: 1
  education1: BSc (Hons) in Mathematics and Statistics, University of Western Australia

- name: Alex Glyn-Davies
  photo: alex_glyn_davies.jpg
  info: Alex is a PhD student at the Cambridge University Engineering Department, supervised by Professor Mark Girolami.  His PhD is sponsored by Splunk Inc, and will be researching machine learning for data streaming applications.  He completed a MEng at Cambridge, with his masters thesis focussing on efficient parameter estimation for particle filtering algorithms.
