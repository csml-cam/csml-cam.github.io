- name: Domenic Di Francesco
  photo: Dom_DiFrancesco.jpg
  info: "Domenic is a chartered mechanical engineer and Research Associate at The Alan Turing Institute, in the Data-Centric engineering programme. He previously worked in engineering consultancies, then completed an industrially sponsored PhD with academic supervision from Aalborg University (Denmark) and the University of Surrey (UK), and industrial supervision from TWI Ltd and Lloyds Register. His research is focused on industrial applications of computational statistics and has published work on the topics of: system effects, value of information, Bayesian hierarchical modelling, structural reliability and risk management."
  email: ddifrancesco@turing.ac.uk
  website: https://github.com/DomDF
  number_educ: 2
  education1: PhD in Engineering, University of Surrey, UK (2021)
  education2: MEng Mechanical Engineering, Durham University, UK (2012)

- name: Ben Boys
  photo: ben_boys.jpg
  info: Ben is a PhD student in the Future Infrastructure and Built Environment CDT at the University of Cambridge supervised by Professor Mark Girolami. During his PhD, he will be working on developing probabilistic models that simulate outcomes of schedules, building upon state-of-the-art deep learning technologies already developed at his co-sponsor company nPlan. Prior to Cambridge, he was working as a Research Assistant at the Data Centric Engineering Group at the University of Exeter.
  email: bb515@cam.ac.uk
  website: https://github.com/bb515
  number_educ: 1
  education1: MEng in Information and Computer Engineering, University of Cambridge (2020)

- name: Justin Bunker
  photo: justin_bunker.png
  info: Justin is a PhD student who is supervised by Professor Mark Girolami in the Engineering department at the University of Cambridge. His research involves the study of statistical approaches for dealing with streaming data. Before starting his PhD, he worked for two years as a software engineer at a trading firm then returned to academia to complete an MPhil and continue on as a research assistant. His PhD is funded by Splunk Inc.
  email: jb2200@cantab.ac.uk
  website: https://github.com/bunkerj
  number_educ: 2
  education1: MPhil in Machine Learning and Machine Intelligence, University of Cambridge (2019)
  education2: BEng in Computer Engineering, Concordia University (2016)

- name: Alex Glyn-Davies
  photo: alex_glyn_davies.jpg
  info: Alex is a PhD student at the Cambridge University Engineering Department, supervised by Professor Mark Girolami.  His PhD is sponsored by Splunk Inc, and will be researching machine learning for data streaming applications.  He completed a MEng at Cambridge, with his masters thesis focussing on efficient parameter estimation for particle filtering algorithms.
  website: https://github.com/alexglyndavies
  email: ag933@cam.ac.uk
  number_educ: 1
  education1: MEng in Information and Computer Engineering, University of Cambridge (2020)

- name: Thomas Gaskin
  photo: thomas_gaskin.jpg
  info: Thomas is a PhD student at the Department of Applied Mathematics and Theoretical Physics, working on topics combining graph topology and network dynamics, stochastic modelling, and machine learning. He is interested in modelling and calibrating dynamical systems using neural differential equations, and understanding the complex behaviour self-organisation, spanning a wide area of application, including social network dynamics, the spread of contagious diseases, and economic activity. Thomas is also a maintainer at the Utopia project, a complex systems modelling framework, and is currently working as a visiting researcher at the Department of Mathematics, Imperial College London.
  website: https://www.damtp.cam.ac.uk/person/trg34
  email: trg34@cam.ac.uk
  number_educ: 3
  education1: M.Sc. Physics, Heidelberg University. Focus on Complex Systems. (2018–2020)
  education2: B.Sc. Mathematics, Heidelberg University, Germany. Focus on Topology. (2017–2020)
  education3: B.Sc. Physics, Heidelberg University, Germany. Focus on Mathematical Physics. (2014–2018)

